    <!-- SEO y vista previa al compartir (genéricos de la plataforma; cada negocio cambia el título al cargar su app).

    <!-- og:image / twitter:image: dejar "/compartir.jpg" tal cual (el plugin busca ese texto). -->
    <meta name="description" content="La app de turnos con la marca de tu negocio: tus clientes reservan en segundos, les llega el recordatorio por WhatsApp y confirman con un toque. Para barberías, peluquerías, consultorios y más." />

    <meta property="og:locale" content="es_AR" />

    <meta property="og:image:width" content="1200" />
